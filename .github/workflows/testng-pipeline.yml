name: TestNG Pipeline

on:
  push:
    branches:
      - master
  schedule:
    # 11:00 PM IST = 5:30 PM UTC
    - cron: '30 17 * * *'
  workflow_dispatch:

jobs:
  test-and-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright browsers and OS dependencies
        run: mvn -B -e exec:java \
          -Dexec.mainClass=com.microsoft.playwright.CLI \
          -Dexec.args="install --with-deps chromium"

      - name: Run TestNG suite
        run: mvn -B clean test

      - name: Generate Surefire HTML report
        if: always()
        run: mvn -B surefire-report:report

      - name: Upload TestNG HTML report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testng-html-report
          path: |
            test-output/**
          if-no-files-found: warn

      - name: Upload Surefire HTML report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-html-report
          path: |
            target/site/**
            target/surefire-reports/**
          if-no-files-found: warn
