name: TestNG Pipeline

on:
  push:
    branches:
      - master
  schedule:
    # 11:00 PM IST = 5:30 PM UTC
    - cron: '30 17 * * *'
  workflow_dispatch:

jobs:
  test-and-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright browser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libatspi2.0-0 \
            libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 \
            libxkbcommon0 libasound2t64

      - name: Install Playwright Chromium
        run: |
          mvn -B -e exec:java \
            -Dexec.mainClass=com.microsoft.playwright.CLI \
            -Dexec.args="install chromium"

      - name: Run TestNG suite
        env:
          HEADLESS: true
        run: mvn -B clean test

      - name: Generate Surefire HTML report
        if: always()
        run: mvn -B surefire-report:report

      - name: Upload TestNG HTML report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testng-html-report
          path: |
            test-output/**
          if-no-files-found: warn

      - name: Upload Surefire HTML report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-html-report
          path: |
            target/site/**
            target/surefire-reports/**
          if-no-files-found: warn

      - name: Package reports into zip archive
        if: always()
        run: |
          zip -r test-reports.zip \
            test-output/ \
            target/site/ \
            target/surefire-reports/ \
            2>/dev/null || true

      - name: Send email with test report
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "TestNG Pipeline Report – ${{ github.repository }} @ ${{ github.run_number }}"
          to: chaitanyassm@outlook.com
          from: ${{ secrets.MAIL_FROM }}
          body: |
            Hello,

            Please find the attached test report for run #${{ github.run_number }} on branch ${{ github.ref_name }}.

            Workflow: ${{ github.workflow }}
            Triggered by: ${{ github.actor }}
            Commit: ${{ github.sha }}
            Run URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Regards,
            GitHub Actions
          attachments: test-reports.zip
