name: TestNG Pipeline

on:
  push:
    branches:
      - master
  schedule:
    # 11:00 PM IST = 5:30 PM UTC
    - cron: '30 17 * * *'
  workflow_dispatch:

jobs:
  test-and-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright browser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libatspi2.0-0 \
            libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 \
            libxkbcommon0 libasound2t64

      - name: Install Playwright Chromium
        run: |
          mvn -B -e exec:java \
            -Dexec.mainClass=com.microsoft.playwright.CLI \
            -Dexec.args="install chromium"

      - name: Run TestNG suite
        env:
          HEADLESS: true
        run: mvn -B clean test

      - name: Generate Surefire HTML report
        if: always()
        run: mvn -B surefire-report:report

      - name: Upload TestNG HTML report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testng-html-report
          path: |
            test-output/**
          if-no-files-found: warn

      - name: Upload Surefire HTML report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-html-report
          path: |
            target/site/**
            target/surefire-reports/**
          if-no-files-found: warn

      - name: Zip reports
        if: always()
        run: |
          zip -r test-reports.zip test-output/ target/surefire-reports/ target/site/ 2>/dev/null || true

      - name: Upload zipped reports artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-zip
          path: test-reports.zip
          if-no-files-found: warn

      - name: Send test report email
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "NovaBank Tests - ${{ job.status }} - ${{ github.ref_name }}"
          to: chaitanyassm@outlook.com
          from: NovaBank CI <${{ secrets.SMTP_USERNAME }}>
          body: |
            NovaBank Banking Application Test Run

            Status  : ${{ job.status }}
            Branch  : ${{ github.ref_name }}
            Commit  : ${{ github.sha }}
            Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            The zip report is available in the GitHub Actions artifacts for this run.
