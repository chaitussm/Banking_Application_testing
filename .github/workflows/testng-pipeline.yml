name: TestNG Pipeline

on:
  push:
    branches:
      - master
  schedule:
    # 11:00 PM IST = 5:30 PM UTC
    - cron: '30 17 * * *'
  workflow_dispatch:

jobs:
  test-and-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Clone Banking Application
        run: git clone --depth 1 https://github.com/chaitussm/Banking_Application.git banking-app

      - name: Start backend service
        working-directory: banking-app/backend
        run: |
          npm install
          npm run dev &
          echo "Backend started"

      - name: Start frontend service
        working-directory: banking-app/frontend
        run: |
          npm install
          npm run dev &
          echo "Frontend started"

      - name: Wait for backend and frontend to be ready
        run: |
          echo "Waiting for backend on port 4000..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/health; then
              echo "Backend is ready"
              break
            fi
            echo "Attempt $i: backend not ready, retrying in 3s..."
            sleep 3
          done
          echo "Waiting for frontend on port 5173..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5173; then
              echo "Frontend is ready"
              break
            fi
            echo "Attempt $i: frontend not ready, retrying in 3s..."
            sleep 3
          done

      - name: Install Playwright browsers and OS dependencies
        run: mvn -B exec:java -e \
          -D exec.mainClass=com.microsoft.playwright.CLI \
          -D exec.args="install --with-deps chromium"

      - name: Run TestNG suite
        run: mvn -B clean test

      - name: Generate Surefire HTML report
        if: always()
        run: mvn -B surefire-report:report

      - name: Upload TestNG HTML report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testng-html-report
          path: |
            test-output/**
          if-no-files-found: warn

      - name: Upload Surefire HTML report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-html-report
          path: |
            target/site/**
            target/surefire-reports/**
          if-no-files-found: warn