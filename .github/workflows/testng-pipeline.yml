name: TestNG Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    # 11:00 PM IST = 5:30 PM UTC
    - cron: '30 17 * * *'
  workflow_dispatch:

jobs:
  test-and-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout Banking Application
        uses: actions/checkout@v4
        with:
          repository: chaitussm/Banking_Application
          path: banking-app

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright browser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libatspi2.0-0 \
            libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 \
            libxkbcommon0 libasound2t64
          sudo npx --yes playwright@1.44.0 install-deps chromium

      - name: Install Playwright Chromium
        run: |
          mvn -B -e exec:java \
            -Dexec.mainClass=com.microsoft.playwright.CLI \
            -Dexec.args="install-deps chromium" || true
          mvn -B -e exec:java \
            -Dexec.mainClass=com.microsoft.playwright.CLI \
            -Dexec.args="install chromium"

      - name: Install and start backend
        working-directory: banking-app/backend
        run: |
          # The app repo commits node_modules with a non-Linux sqlite3 binary.
          rm -rf node_modules
          npm install
          nohup npm start > "${GITHUB_WORKSPACE}/backend.log" 2>&1 &
          echo "Backend PID $!"

      - name: Install and start frontend
        working-directory: banking-app/frontend
        run: |
          npm install
          nohup npm run dev -- --host 127.0.0.1 --port 5173 > "${GITHUB_WORKSPACE}/frontend.log" 2>&1 &
          echo "Frontend PID $!"

      - name: Wait for application
        run: |
          chmod +x scripts/wait-for-url.sh
          scripts/wait-for-url.sh http://127.0.0.1:4000/health 90
          scripts/wait-for-url.sh http://127.0.0.1:5173/login 90

      - name: Run TestNG suite
        env:
          HEADLESS: true
          UI_TESTS_REQUIRE_APP: 'true'
        run: mvn -B clean test

      - name: Dump application logs
        if: failure()
        run: |
          echo '===== backend.log ====='
          cat backend.log || true
          echo '===== frontend.log ====='
          cat frontend.log || true

      - name: Generate Surefire HTML report
        if: always()
        run: mvn -B surefire-report:report-only

      - name: Upload TestNG HTML report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testng-html-report
          path: |
            test-output/**
          if-no-files-found: warn

      - name: Upload Surefire HTML report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-html-report
          path: |
            target/site/**
            target/surefire-reports/**
          if-no-files-found: warn

      - name: Generate HTML email report
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/generate_email_report.py

      - name: Zip reports
        if: always()
        run: |
          zip -r test-reports.zip test-output/ target/surefire-reports/ target/site/ email-report.html 2>/dev/null || true

      - name: Upload zipped reports artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-zip
          path: test-reports.zip
          if-no-files-found: warn

      - name: Send email with HTML report
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: 587
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          #subject: "TestNG Pipeline – ${{ env.JOB_STATUS }}   | ${{ github.ref_name }} @ ${{ github.sha }}"
          subject: "TestNG Pipeline -${{ env.JOB_STATUS }}   |   ${{github.sha}}  "
          to: ${{ secrets.EMAIL_TO }}
          from: ${{ secrets.SMTP_USERNAME }}
          html_body: file://email-report.html
